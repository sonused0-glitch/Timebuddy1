name: TIME BUDDIES - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build TIME BUDDIES APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find TIME BUDDIES project
        run: |
          set -e

          echo "Searching for Android project..."

          PROJECT_DIR=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" | head -n 1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            echo "Make sure the TIME BUDDIES Android project files are uploaded."
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "Building TIME BUDDIES..."

          gradle --no-daemon assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload TIME BUDDIES APK
        uses: actions/upload-artifact@v4
        with:
          name: TIME-BUDDIES-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
